name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc972c04bb8b7e9d5e1b2b5b2e3b  # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-windows:
    name: Build Windows Electron App
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc972c04bb8b7e9d5e1b2b5b2e3b  # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Dashboard
        run: pnpm --filter @eata/dashboard build

      - name: Install Electron
        run: pnpm add -D electron@39 --filter @eata/self-test-electron-app

      - name: Package Windows app
        working-directory: fixtures/self-test-electron-app
        run: npx electron-builder --win --config electron-builder.yml

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectronHound-Windows
          path: |
            fixtures/self-test-electron-app/dist/*.exe
            fixtures/self-test-electron-app/dist/*.msi
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-ghrelease@v2
        with:
          files: |
            fixtures/self-test-electron-app/dist/*.exe
            fixtures/self-test-electron-app/dist/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
