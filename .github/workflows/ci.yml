name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.changeset/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.changeset/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, Lint, Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run typecheck
        run: pnpm -r run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Run tests with coverage (enforces coverage thresholds from vitest.config.ts)
        run: pnpm test -- --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97  # v4.6.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Run benchmarks
        run: pnpm bench

      - name: Check benchmark regression
        run: pnpm bench:check
        continue-on-error: true

  self-test:
    name: Self-Test (Dogfooding)
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      DISPLAY: ':99'
      ELECTRON_DISABLE_GPU: '1'
      ELECTRON_NO_ATTACH_CONSOLE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnotify-dev \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron for self-test fixture
        run: pnpm add -D electron@39 --filter @eata/self-test-electron-app

      - name: Build
        run: pnpm build

      - name: Run self-test fixture unit tests
        run: pnpm --filter @eata/self-test-electron-app test

      - name: Run self-test via xvfb-run
        run: |
          chmod +x scripts/self-test.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            scripts/self-test.sh
        timeout-minutes: 5

  electron-e2e:
    name: Electron E2E (Node ${{ matrix.node-version }}, Electron ${{ matrix.electron-version }})
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
        electron-version: ['28', '30', '32', '39']
        exclude:
          - node-version: '22'
            electron-version: '28'

    continue-on-error: ${{ matrix.electron-version == '39' }}

    env:
      DISPLAY: ':99'
      ELECTRON_DISABLE_GPU: '1'
      ELECTRON_NO_ATTACH_CONSOLE: '1'
      ELECTRON_VERSION: ${{ matrix.electron-version }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47  # v4.0.0
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnotify-dev \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron ${{ matrix.electron-version }}
        run: pnpm add -D electron@${{ matrix.electron-version }} --filter @eata/test-electron-app

      - name: Build
        run: pnpm build

      - name: Run fixture unit tests
        run: pnpm --filter @eata/test-electron-app test

      - name: Run E2E test via xvfb-run
        run: |
          chmod +x scripts/e2e-ci.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            scripts/e2e-ci.sh
        timeout-minutes: 5
