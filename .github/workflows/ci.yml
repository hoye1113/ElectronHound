name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.changeset/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.changeset/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test, Lint, Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run typecheck
        run: pnpm -r run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Run tests with coverage (enforces coverage thresholds from vitest.config.ts)
        run: pnpm test -- --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Run benchmarks
        run: pnpm bench

      - name: Check benchmark regression
        run: pnpm bench:check
        continue-on-error: true

  electron-e2e:
    name: Electron E2E (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    env:
      # xvfb-run provides a virtual X11 framebuffer for headless Electron
      DISPLAY: ':99'
      # Electron flags for CI environments
      ELECTRON_DISABLE_GPU: '1'
      ELECTRON_NO_ATTACH_CONSOLE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnotify-dev \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run fixture unit tests
        run: pnpm --filter @eata/test-electron-app test

      - name: Run E2E test via xvfb-run
        run: |
          chmod +x scripts/e2e-ci.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            scripts/e2e-ci.sh
        timeout-minutes: 5
